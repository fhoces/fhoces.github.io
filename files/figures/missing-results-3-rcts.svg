<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 108" width="1000" height="108" role="img" aria-labelledby="t d">
<title id="t">For RCTs, the missing questions become observable</title>
<desc id="d">The published causal literature split into observational studies (80%, grey) and RCTs (20%, navy). A dashed box under the RCT segment marks the unreported pre-registered questions, which registries make it possible to measure.</desc>
<rect width="1000" height="108" fill="#FFFFFF"/>
<rect x="0" y="0" width="800" height="60" fill="#E0E0E0"/>
<rect x="800" y="0" width="200" height="60" fill="#000080"/>
<text x="400" y="30.0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#000000" font-family="'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700">Observational</text>
<text x="900" y="30.0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#FFFFFF" font-family="'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700">RCTs</text>
<rect x="800.75" y="62.75" width="198.5" height="40.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
