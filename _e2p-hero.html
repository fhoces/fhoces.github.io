<script>
// Pinned evidence-to-policy diagram (landing, Research and Policy pages).
// The page opens with its title, then the diagram; as the content scrolls
// in, the diagram shrinks and moves to the top-right corner. Where the
// window has a free right margin it parks there at full strength; otherwise
// it parks behind the text at a background strength (styles.css). Every page
// places it identically, so moving between pages keeps it in the same spot.
(function () {
  var img = document.getElementById("e2p-hero");
  if (!img) return;
  document.body.appendChild(img);  var ASPECT = 202.138 / 484.67, BAND = 90, GAP = 16, span = 1;
  var hero = null, dock = null;
  function layout() {
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var header = document.getElementById("quarto-header");
    var title = document.getElementById("title-block-header");
    var main = document.querySelector(".about-contents") || document.querySelector("main");
    var navH = header ? header.offsetHeight : 0;
    var titleBottom = title ? title.getBoundingClientRect().bottom + window.scrollY : navH;
    var w = Math.min(720, vw * 0.9), h = w * ASPECT;
    // The title gets a band of BAND px under the navbar; the diagram is
    // centred between that band and the content, which starts at 80% of the
    // window. Same spot on every page unless a title outgrows the band.
    var regionTop = navH + BAND;
    var contentTop = Math.max(vh * 0.8, regionTop + h + 60);
    var top = Math.max(regionTop + (contentTop - regionTop - h) / 2, titleBottom + 12);
    contentTop = Math.max(contentTop, top + h + 30);
    span = contentTop - top;
    hero = { left: (vw - w) / 2, top: top, width: w };
    // Parking spot: the free margin right of the text if it is wide enough,
    // otherwise a small corner spot behind the text.
    // Capped at the standard 800px text column's margin, so the landing page
    // (narrower column) parks it at the same size as the other pages.
    var margin = Math.min(vw - (main ? main.getBoundingClientRect().right : vw), (vw - 800) / 2) - 2 * GAP;
    var inMargin = margin >= 150;
    var dw = inMargin ? Math.min(240, margin) : Math.min(160, vw * 0.4);
    dock = { left: vw - GAP - dw, top: navH + GAP, width: dw };
    document.body.classList.toggle("e2p-dock-margin", inMargin);
    img.style.width = w + "px";
    img.style.left = hero.left + "px";
    img.style.top = hero.top + "px";
    document.body.style.setProperty("--e2p-space", Math.max(0, contentTop - titleBottom) + "px");
    document.body.classList.add("e2p-on");
    update();
  }
  function update() {
    var t = Math.min(1, Math.max(0, window.scrollY / (0.9 * span)));
    t = t * t * (3 - 2 * t);  // ease in and out
    var s = 1 + (dock.width / hero.width - 1) * t;
    img.style.transform = "translate(" + ((dock.left - hero.left) * t).toFixed(1) + "px," +
      ((dock.top - hero.top) * t).toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
    document.body.style.setProperty("--e2p-t", t.toFixed(3));
  }
  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("load", layout);
  window.addEventListener("scroll", function () { requestAnimationFrame(update); }, { passive: true });
})();
</script>
