<script>
// Pinned evidence-to-policy diagram (landing, Research and Policy pages).
// The page opens with its title, then the diagram, then the text, which
// scrolls up over the diagram while the diagram fades out completely
// (strengths in styles.css). From 576px up every page places it at the
// same spot, so moving between pages keeps it still.
(function () {
  var img = document.getElementById("e2p-hero");
  if (!img) return;
  document.body.appendChild(img);
  var ASPECT = 202.138 / 484.67, BAND = 104, GAP = 16, span = 1;
  function layout() {
    var vw = document.documentElement.clientWidth;
    var header = document.getElementById("quarto-header");
    var title = document.getElementById("title-block-header");
    var navH = header ? header.offsetHeight : 0;
    var titleBottom = title ? title.getBoundingClientRect().bottom + window.scrollY : navH;
    var w = Math.min(540, vw * 0.8), h = w * ASPECT;
    // Just under the title. From 576px up every title fits in a BAND px band
    // under the navbar, so the diagram sits at the same spot on every page;
    // on phones the landing title block is much taller, so each page puts it
    // right under its own title instead.
    var band = vw >= 576 ? navH + BAND : 0;
    var top = Math.max(titleBottom, band) + GAP;
    var contentTop = top + h + 32;
    // The diagram is fully transparent once the text's first line reaches
    // its top edge.
    span = contentTop - top;
    img.style.width = w + "px";
    img.style.left = (vw - w) / 2 + "px";
    img.style.top = top + "px";
    document.body.style.setProperty("--e2p-space", Math.max(0, contentTop - titleBottom) + "px");
    document.body.classList.add("e2p-on");
    fade();
  }
  function fade() {
    // A page too short to scroll that far finishes the fade at its bottom.
    var room = document.documentElement.scrollHeight - window.innerHeight;
    var t = Math.min(1, Math.max(0, window.scrollY / Math.max(1, Math.min(span, room))));
    document.body.style.setProperty("--e2p-t", t.toFixed(3));
  }
  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("load", layout);
  window.addEventListener("scroll", function () { requestAnimationFrame(fade); }, { passive: true });
})();
</script>
